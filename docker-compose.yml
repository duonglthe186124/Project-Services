services:
  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "5000:8080"
    env_file:
      - .env
    depends_on:
      - auth-service
      - catalog-service
      - order-service
      - payment-service
    restart: unless-stopped

  auth-service:
    build:
      context: ./AuthService
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "5265:8080"
    env_file:
      - .env
    restart: unless-stopped

  catalog-service:
    build:
      context: ./CatalogService
      dockerfile: Dockerfile
    container_name: catalog-service
    ports:
      - "5266:8080"
    env_file:
      - .env
    restart: unless-stopped

  order-service:
    build:
      context: ./OrderService
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "5267:8080"
    env_file:
      - .env
    environment:
      - CatalogService__BaseUrl=http://catalog-service:8080
    depends_on:
      - catalog-service
    restart: unless-stopped

  payment-service:
    build:
      context: ./PaymentService
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "5268:8080"
    env_file:
      - .env
    environment:
      - OrderService__BaseUrl=http://order-service:8080
    depends_on:
      - order-service
    restart: unless-stopped
